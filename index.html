<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سایت من</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-4">یک لحظه تأمل...</h1>
        
        <!-- جای نمایش شعر -->
        <div id="quote-box" class="mb-6 p-4 border-r-4 border-blue-500 bg-gray-50">
            <p id="quote-text" class="italic">دکمه زیر را بزن تا یک شعر برایت بخوانم.</p>
            <p id="quote-author" class="font-bold mt-2 text-blue-600"></p>
        </div>

        <button onclick="getQuote()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
            شعر جدید
        </button>
    </div>

    <script>
        async function getQuote() {
            const res = await fetch('/api/quote');
            const data = await res.json();
            document.getElementById('quote-text').innerText = data.text;
            document.getElementById('quote-author').innerText = data.author;
        }
    </script>
</body>
</html>
