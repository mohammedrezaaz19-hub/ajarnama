<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجرنما | پلتفرم ابری</title>
    <!-- استفاده از Tailwind CSS برای استایل‌دهی مدرن -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- هدر سایت -->
    <header class="py-6 px-8 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wider text-emerald-400">⚡ اجرنما (Ajarnama)</h1>
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20">نسخه ۱.۱.۰</span>
    </header>

    <!-- محتوای اصلی -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 py-12">
        <div class="max-w-xl bg-slate-800/50 backdrop-blur-md p-8 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-3xl font-extrabold mb-4 text-white">خوش آمدید به نسل جدید وب!</h2>
            <p class="text-slate-300 text-lg leading-relaxed mb-6">
                این وب‌سایت با زبان قدرتمند <span class="text-cyan-400 font-semibold">Go</span> نوشته شده و بر روی هاست ابری <span class="text-purple-400 font-semibold">Railway</span> زنده و فعال است.
            </p>
            
            <div class="flex flex-wrap justify-center gap-4">
                <a href="/api/status" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-900/40">
                    مشاهده وضعیت API 🔍
                </a>
                <a href="https://github.com/mohammedrezaaz19-hub/ajarnama" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-6 py-3 rounded-xl transition">
                    گیت‌هاب پروژه 📂
                </a>
            </div>
        </div>
    </main>

    <!-- فوتر -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        طراحی‌شده با عشق و تکنولوژی‌های مدرن 🚀
    </footer>

</body>
</html>
