<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجارنما | نسخه هنری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اضافه کردن فونت وزیرمتن -->
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css');

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }

        /* افکت انیمیشن */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-button {
            background: linear-gradient(45deg, #bf953f, #fcf6ba);
            color: #1a1a2e;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .gold-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(191, 149, 63, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <main class="container mx-auto px-4 py-10">
        <!-- اضافه شدن کلاس animate-card -->
        <div class="max-w-lg mx-auto glass p-10 shadow-2xl text-center animate-card">
            
            <h1 class="text-4xl font-extrabold mb-8 gold-text">اجارنما</h1>
            
            <div id="quote-box" class="mb-10 min-h-[120px] flex flex-col justify-center">
                <p id="quote-text" class="text-xl text-gray-200 leading-relaxed italic">
                    منتظر شنیدن کلام هستم...
                </p>
                <p id="quote-author" class="mt-4 text-lg gold-text font-semibold"></p>
            </div>

            <button onclick="getQuote()" class="gold-button w-full py-4 rounded-xl text-lg shadow-lg">
                شعر جدید را بخوان
            </button>

        </div>
    </main>

    <script>
        async function getQuote() {
            document.getElementById('quote-text').innerText = "...";
            document.getElementById('quote-author').innerText = "";
            try {
                const res = await fetch('/api/quote');
                const data = await res.json();
                document.getElementById('quote-text').innerText = data.text;
                document.getElementById('quote-author').innerText = data.author;
            } catch (e) {
                document.getElementById('quote-text').innerText = "خطا در اتصال به سرور";
            }
        }
    </script>
</body>
</html>
