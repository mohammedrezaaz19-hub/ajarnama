<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجرنما | نسخه اصلی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css');

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at center, #24243e 0%, #0f0c29 100%);
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh;
            transition: all 0.5s ease;
        }

        .light-mode {
            background: #f8fafc !important;
            background-image: none !important;
            color: #1e293b;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card { animation: fadeInUp 0.8s ease-out forwards; }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .light-mode .glass { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); }
        
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4">

    <button onclick="toggleTheme()" class="absolute top-5 left-5 p-3 rounded-full bg-white/10 hover:bg-white/20 transition">
        🌓
    </button>

    <main class="container mx-auto max-w-lg">
        <div class="glass p-8 shadow-2xl text-center animate-card">
            
            <div class="mb-10 border-b border-white/10 pb-6">
                <h1 class="text-3xl font-bold mb-4 gold-text">اجرنما</h1>
                <p class="text-sm text-gray-400 leading-relaxed">
                    این سایت توسط هوش مصنوعی و بهترین هکر جهان ساخته شده <br>
                    <span class="text-amber-500 font-bold text-base">تقدیم به آقای ایمان سیاه منصوری</span>
                </p>
            </div>
            
            <div id="quote-box" class="mb-10 min-h-[120px] flex flex-col justify-center">
                <p id="quote-text" class="text-xl leading-relaxed italic">
                    در انتظار کلام...
                </p>
                <p id="quote-author" class="mt-4 text-md gold-text font-semibold"></p>
            </div>

            <button onclick="getQuote()" class="bg-gradient-to-r from-amber-500 to-yellow-600 w-full py-3 rounded-xl text-black font-bold shadow-lg hover:scale-105 transition">
                شعر جدید
            </button>

        </div>
    </main>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        async function getQuote() {
            const quoteEl = document.getElementById('quote-text');
            quoteEl.innerText = "...";
            try {
                const res = await fetch('/api/quote');
                const data = await res.json();
                quoteEl.innerText = data.text;
                quoteEl.innerText = data.text;
                quoteEl.innerText = data.text;
                quoteEl.innerText = data.text;
                quoteEl.innerText = data.text;
                document.getElementById('quote-author').innerText = data.author;
            } catch (e) {
                quoteEl.innerText = "خطا در اتصال";
            }
        }
    </script>
</body>
</html>
