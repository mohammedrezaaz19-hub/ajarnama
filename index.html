<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجرنما | پورتال اختصاصی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css');
        body { font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at center, #24243e 0%, #0f0c29 100%); min-height: 100vh; transition: all 0.3s; color: white; }
        .light-mode { background: #f8fafc !important; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .light-mode .glass { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); }
        .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-btn { transition: 0.3s; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #bf953f; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4">

    <nav class="glass mb-6 p-2 flex flex-wrap gap-1 justify-center shadow-lg">
        <button onclick="renderPage('home')" class="nav-btn">خانه</button>
        <button onclick="renderPage('services')" class="nav-btn">خدمات</button>
        <button onclick="renderPage('portfolio')" class="nav-btn">پروژه‌ها</button>
        <button onclick="renderPage('team')" class="nav-btn">تیم ما</button>
        <button onclick="renderPage('wisdom')" class="nav-btn">حکمت</button>
        <button onclick="renderPage('blog')" class="nav-btn">وبلاگ</button>
        <button onclick="renderPage('contact')" class="nav-btn">تماس</button>
        <button onclick="renderPage('ads')" class="nav-btn">تبلیغات</button>
        <button onclick="toggleTheme()" class="nav-btn text-xl">🌓</button>
    </nav>

    <main id="app-container" class="container mx-auto max-w-lg glass p-8 shadow-2xl min-h-[400px] fade-in">
        <!-- محتوا توسط JS تزریق می‌شود -->
    </main>

    <script>
        const pages = {
            home: `
                <h1 class="text-3xl font-bold mb-4 gold-text">اجرنما</h1>
                <p class="leading-relaxed">این سایت توسط هوش مصنوعی و بهترین هکر جهان ساخته شده.</p>
                <div class="mt-6 p-4 bg-white/5 rounded-xl border border-white/10">
                    <p class="font-bold text-amber-500">تقدیم به آقای ایمان سیاه منصوری</p>
                    <p class="text-sm mt-2 text-gray-400">اجرنما؛ نماد دقت، قدرت و معماری نوین.</p>
                </div>`,
            services: `
                <h2 class="text-2xl font-bold mb-4 gold-text">خدمات اجرنما</h2>
                <ul class="space-y-3 text-sm">
                    <li>🔹 طراحی و معماری مدرن</li>
                    <li>🔹 اجرای سازه‌های لوکس</li>
                    <li>🔹 نظارت و مدیریت پروژه</li>
                    <li>🔹 بهینه‌سازی انرژی ساختمان</li>
                </ul>`,
            portfolio: `
                <h2 class="text-2xl font-bold mb-4 gold-text">پروژه‌های انجام شده</h2>
                <div class="space-y-4">
                    <div class="p-3 bg-white/5 rounded-lg">پروژه مجتمع الماس (1404)</div>
                    <div class="p-3 bg-white/5 rounded-lg">طراحی ویلای مدرن (1405)</div>
                </div>`,
            team: `
                <h2 class="text-2xl font-bold mb-4 gold-text">تیم اجرنما</h2>
                <p class="text-sm">تیمی متشکل از برترین مهندسان و معماران برای ساخت آینده.</p>`,
            wisdom: `
                <h2 class="text-2xl font-bold mb-4 gold-text">شعر و حکمت</h2>
                <p class="italic text-lg">«کار نیکو کردن از پر کردن است»</p>`,
            blog: `
                <h2 class="text-2xl font-bold mb-4 gold-text">آخرین اخبار</h2>
                <p class="text-sm">خبرهای داغ از پیشرفت پروژه‌های اجرنما...</p>`,
            contact: `
                <h2 class="text-2xl font-bold mb-4 gold-text">تماس با ما</h2>
                <input type="text" placeholder="نام شما" class="w-full p-2 mb-2 bg-white/10 rounded-lg outline-none">
                <textarea placeholder="پیام شما" class="w-full p-2 mb-2 bg-white/10 rounded-lg outline-none"></textarea>
                <button class="w-full bg-amber-600 p-2 rounded-lg font-bold">ارسال</button>`,
            ads: `
                <h2 class="text-2xl font-bold mb-4 gold-text">تبلیغات</h2>
                <div class="border-2 border-dashed border-amber-600 p-6 text-center text-amber-500">
                    فضای تبلیغاتی جهت معرفی حامیان مالی
                </div>`
        };

        function renderPage(pageId) {
            const container = document.getElementById('app-container');
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');
            container.innerHTML = pages[pageId];
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        renderPage('home');
    </script>
</body>
</html>
